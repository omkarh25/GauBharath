<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3A2410"/>
      <stop offset="100%" stop-color="#0E0904"/>
    </radialGradient>
    <linearGradient id="jar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="100%" stop-color="#D8B894"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D2691E"/>
      <stop offset="100%" stop-color="#5C3A1E"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#8E4214" stroke-width="1" opacity="0.4"/>

  <ellipse cx="200" cy="240" rx="120" ry="120" fill="#D2691E" opacity="0.1"/>

  <g transform="translate(110,110)">
    <!-- lid -->
    <ellipse cx="90" cy="20" rx="90" ry="22" fill="url(#lid)"/>
    <rect x="0" y="20" width="180" height="20" fill="#8E4214"/>
    <ellipse cx="90" cy="40" rx="90" ry="22" fill="#5C3A1E"/>
    <!-- body -->
    <rect x="0" y="40" width="180" height="170" fill="url(#jar)"/>
    <ellipse cx="90" cy="210" rx="90" ry="22" fill="#A6815C"/>

    <!-- inner cream -->
    <rect x="6" y="40" width="168" height="6" fill="#FAE6CF"/>

    <!-- highlight -->
    <rect x="10" y="50" width="20" height="155" fill="#FFFFFF" opacity="0.4"/>

    <!-- Label -->
    <rect x="20" y="80" width="140" height="100" rx="3" fill="#5C3A1E"/>
    <rect x="24" y="84" width="132" height="92" rx="2" fill="none" stroke="#FAE6CF" stroke-width="0.8"/>
    <text x="90" y="110" font-family="Georgia, serif" font-size="9" font-weight="bold" fill="#FAE6CF" text-anchor="middle" letter-spacing="1.5">SKIN &amp; LIP</text>
    <text x="90" y="125" font-family="Georgia, serif" font-size="9" font-weight="bold" fill="#FAE6CF" text-anchor="middle" letter-spacing="1.5">CARE BALM</text>
    <line x1="36" y1="135" x2="144" y2="135" stroke="#FAE6CF" stroke-width="0.5"/>
    <text x="90" y="148" font-family="Georgia, serif" font-size="6.5" fill="#FAE6CF" text-anchor="middle" letter-spacing="1">with cow ghritham</text>
    <text x="90" y="168" font-family="Georgia, serif" font-size="5.5" fill="#FAE6CF" text-anchor="middle" letter-spacing="1" opacity="0.8">— gau bharath —</text>
  </g>
</svg>
