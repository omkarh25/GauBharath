<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3A2410"/>
      <stop offset="100%" stop-color="#0E0904"/>
    </radialGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF6F0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D8B894" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D2691E"/>
      <stop offset="100%" stop-color="#5C3A1E"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#8E4214" stroke-width="1" opacity="0.4"/>

  <ellipse cx="200" cy="240" rx="100" ry="130" fill="#D2691E" opacity="0.1"/>

  <!-- Bottle -->
  <g transform="translate(130,90)">
    <rect x="55" y="0" width="40" height="38" rx="3" fill="url(#cap)"/>
    <rect x="50" y="38" width="50" height="6" fill="#3A2410"/>
    <rect x="60" y="44" width="30" height="18" fill="url(#bottle)" opacity="0.8"/>

    <!-- body -->
    <path d="M30,62 Q30,60 32,60 L118,60 Q120,60 120,62 L130,85 Q140,100 140,120 L140,250 Q140,270 120,270 L30,270 Q10,270 10,250 L10,120 Q10,100 20,85 Z" fill="url(#bottle)"/>

    <!-- tablets inside (visible) -->
    <g opacity="0.7">
      <ellipse cx="50" cy="200" rx="6" ry="3" fill="#A6815C"/>
      <ellipse cx="70" cy="220" rx="6" ry="3" fill="#A6815C" transform="rotate(20 70 220)"/>
      <ellipse cx="90" cy="200" rx="6" ry="3" fill="#A6815C"/>
      <ellipse cx="60" cy="240" rx="6" ry="3" fill="#A6815C" transform="rotate(-15 60 240)"/>
      <ellipse cx="85" cy="240" rx="6" ry="3" fill="#A6815C"/>
      <ellipse cx="75" cy="180" rx="6" ry="3" fill="#A6815C" transform="rotate(30 75 180)"/>
    </g>

    <!-- Label -->
    <rect x="20" y="100" width="120" height="80" rx="3" fill="#5C3A1E"/>
    <rect x="24" y="104" width="112" height="72" rx="2" fill="none" stroke="#FAE6CF" stroke-width="0.8"/>
    <text x="80" y="125" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#FAE6CF" text-anchor="middle" letter-spacing="1.5">HING VATI</text>
    <line x1="34" y1="133" x2="126" y2="133" stroke="#FAE6CF" stroke-width="0.5"/>
    <text x="80" y="148" font-family="Georgia, serif" font-size="6.5" fill="#FAE6CF" text-anchor="middle" letter-spacing="0.8">Digestive wellness</text>
    <text x="80" y="170" font-family="Georgia, serif" font-size="5.5" fill="#FAE6CF" text-anchor="middle" letter-spacing="0.8" opacity="0.8">— gau bharath —</text>
  </g>
</svg>
