<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3A2410"/>
      <stop offset="100%" stop-color="#0E0904"/>
    </radialGradient>
    <linearGradient id="canister" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A4F2A"/>
      <stop offset="50%" stop-color="#5C3A1E"/>
      <stop offset="100%" stop-color="#281808"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D2691E"/>
      <stop offset="100%" stop-color="#8E4214"/>
    </linearGradient>
    <radialGradient id="steam" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#FAF6F0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FAF6F0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#8E4214" stroke-width="1" opacity="0.4"/>

  <!-- Steam -->
  <g opacity="0.6">
    <path d="M180,80 Q190,60 180,40 Q170,20 185,5" stroke="#FAF6F0" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M210,90 Q220,70 210,50 Q200,30 215,15" stroke="#FAF6F0" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M195,75 Q205,55 195,35" stroke="#FAF6F0" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Canister -->
  <g transform="translate(115,90)">
    <!-- lid -->
    <rect x="0" y="0" width="170" height="25" rx="4" fill="url(#lid)"/>
    <rect x="0" y="25" width="170" height="8" fill="#5C3A1E"/>
    <!-- body -->
    <rect x="0" y="33" width="170" height="220" rx="6" fill="url(#canister)"/>
    <!-- highlight -->
    <rect x="5" y="40" width="20" height="200" fill="#A6815C" opacity="0.4"/>

    <!-- Label -->
    <rect x="15" y="70" width="140" height="140" rx="3" fill="#FAE6CF"/>
    <rect x="19" y="74" width="132" height="132" rx="2" fill="none" stroke="#8E4214" stroke-width="0.8"/>

    <text x="85" y="105" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3A1E" text-anchor="middle" letter-spacing="2">ARJUNA</text>
    <text x="85" y="125" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#5C3A1E" text-anchor="middle" letter-spacing="2">TEA</text>

    <!-- leaf emblem -->
    <g transform="translate(85,150)">
      <path d="M0,0 Q-12,-5 -8,-18 Q0,-15 8,-18 Q12,-5 0,0 Z" fill="#2D5016"/>
      <line x1="0" y1="0" x2="0" y2="-15" stroke="#1E360F" stroke-width="0.8"/>
    </g>

    <text x="85" y="180" font-family="Georgia, serif" font-size="6.5" fill="#5C3A1E" text-anchor="middle" letter-spacing="1.5">HEART WELLNESS</text>
    <text x="85" y="195" font-family="Georgia, serif" font-size="5.5" fill="#8E4214" text-anchor="middle" letter-spacing="1">— gau bharath —</text>
  </g>

  <g fill="#FFD580">
    <circle cx="90" cy="100" r="1.4" opacity="0.7"/>
    <circle cx="320" cy="140" r="1.2" opacity="0.6"/>
    <circle cx="80" cy="320" r="1.5" opacity="0.5"/>
    <circle cx="320" cy="300" r="1.3" opacity="0.6"/>
  </g>
</svg>
