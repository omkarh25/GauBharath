<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3A2410"/>
      <stop offset="100%" stop-color="#0E0904"/>
    </radialGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD580"/>
      <stop offset="50%" stop-color="#D2691E"/>
      <stop offset="100%" stop-color="#5C3A1E"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5C3A1E"/>
      <stop offset="100%" stop-color="#281808"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#8E4214" stroke-width="1" opacity="0.4"/>

  <!-- Glow -->
  <ellipse cx="200" cy="220" rx="120" ry="140" fill="#D2691E" opacity="0.15"/>

  <!-- Bottle -->
  <g transform="translate(120,80)">
    <!-- cap -->
    <rect x="60" y="0" width="40" height="35" rx="3" fill="url(#cap)"/>
    <rect x="55" y="32" width="50" height="8" fill="#3A2410"/>
    <!-- neck -->
    <rect x="65" y="40" width="30" height="25" fill="url(#bottle)"/>
    <!-- body -->
    <path d="M50,70 Q50,65 55,65 L145,65 Q150,65 150,70 L160,90 Q170,110 170,140 L170,260 Q170,280 150,280 L50,280 Q30,280 30,260 L30,140 Q30,110 40,90 Z" fill="url(#bottle)"/>
    <!-- highlight -->
    <path d="M40,90 Q40,80 50,80 L60,80 L60,260 Q55,260 50,260 Q40,260 40,250 Z" fill="#FFD580" opacity="0.6"/>

    <!-- Label -->
    <rect x="40" y="150" width="120" height="100" rx="4" fill="#FAE6CF"/>
    <rect x="45" y="155" width="110" height="90" rx="2" fill="none" stroke="#8E4214" stroke-width="0.8"/>
    <text x="100" y="180" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#5C3A1E" text-anchor="middle" letter-spacing="1.5">ASTA DASHA</text>
    <text x="100" y="195" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#5C3A1E" text-anchor="middle" letter-spacing="1.5">LOBHANA</text>
    <line x1="55" y1="205" x2="145" y2="205" stroke="#8E4214" stroke-width="0.5"/>
    <text x="100" y="220" font-family="Georgia, serif" font-size="7" fill="#5C3A1E" text-anchor="middle" letter-spacing="1">SACRED FORMULA</text>
    <text x="100" y="232" font-family="Georgia, serif" font-size="6" fill="#8E4214" text-anchor="middle" letter-spacing="0.8">— 18 INGREDIENTS —</text>
  </g>

  <!-- Sparkles -->
  <g fill="#FFD580">
    <circle cx="80" cy="120" r="1.5" opacity="0.7"/>
    <circle cx="320" cy="140" r="1.2" opacity="0.6"/>
    <circle cx="70" cy="280" r="1.4" opacity="0.5"/>
    <circle cx="330" cy="260" r="1.3" opacity="0.6"/>
  </g>
</svg>
