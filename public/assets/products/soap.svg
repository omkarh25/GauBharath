<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3A2410"/>
      <stop offset="100%" stop-color="#0E0904"/>
    </radialGradient>
    <linearGradient id="soap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4D8B6"/>
      <stop offset="50%" stop-color="#D8B894"/>
      <stop offset="100%" stop-color="#A6815C"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#8E4214" stroke-width="1" opacity="0.4"/>

  <ellipse cx="200" cy="240" rx="140" ry="100" fill="#D2691E" opacity="0.1"/>

  <!-- Soap bar -->
  <g transform="translate(70,140)">
    <rect x="0" y="40" width="260" height="120" rx="14" fill="url(#soap)" stroke="#7A4F2A" stroke-width="2"/>
    <!-- top face -->
    <path d="M0,40 Q130,0 260,40 Z" fill="#F4D8B6" stroke="#7A4F2A" stroke-width="2"/>
    <!-- side highlight -->
    <rect x="0" y="40" width="260" height="20" fill="#E8C896" opacity="0.5"/>

    <!-- Label area -->
    <rect x="80" y="70" width="100" height="60" rx="4" fill="#5C3A1E" opacity="0.85"/>
    <rect x="84" y="74" width="92" height="52" rx="2" fill="none" stroke="#FAE6CF" stroke-width="0.8"/>
    <text x="130" y="92" font-family="Georgia, serif" font-size="9" font-weight="bold" fill="#FAE6CF" text-anchor="middle" letter-spacing="1.5">GAU</text>
    <text x="130" y="105" font-family="Georgia, serif" font-size="9" font-weight="bold" fill="#FAE6CF" text-anchor="middle" letter-spacing="1.5">BHARATH</text>
    <line x1="92" y1="110" x2="168" y2="110" stroke="#FAE6CF" stroke-width="0.5"/>
    <text x="130" y="120" font-family="Georgia, serif" font-size="6" fill="#FAE6CF" text-anchor="middle" letter-spacing="1">HERBAL SOAP</text>

    <!-- Texture marks -->
    <g opacity="0.4">
      <circle cx="20" cy="100" r="1.5" fill="#5C3A1E"/>
      <circle cx="35" cy="130" r="1.2" fill="#5C3A1E"/>
      <circle cx="240" cy="100" r="1.5" fill="#5C3A1E"/>
      <circle cx="232" cy="135" r="1.2" fill="#5C3A1E"/>
      <circle cx="20" cy="148" r="1.0" fill="#5C3A1E"/>
      <circle cx="250" cy="150" r="1.0" fill="#5C3A1E"/>
    </g>
  </g>

  <!-- Bubbles -->
  <g opacity="0.5" fill="#FAE6CF">
    <circle cx="100" cy="120" r="6"/>
    <circle cx="115" cy="105" r="4"/>
    <circle cx="125" cy="118" r="3"/>
    <circle cx="300" cy="140" r="5"/>
    <circle cx="290" cy="125" r="3"/>
    <circle cx="305" cy="155" r="4"/>
  </g>
</svg>
