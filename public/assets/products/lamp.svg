<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3A2410"/>
      <stop offset="100%" stop-color="#0E0904"/>
    </radialGradient>
    <radialGradient id="flame" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FFF4D6"/>
      <stop offset="40%" stop-color="#FFB347"/>
      <stop offset="80%" stop-color="#D2691E"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A4F2A"/>
      <stop offset="100%" stop-color="#3A2410"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#8E4214" stroke-width="1" opacity="0.4"/>

  <!-- Glow halo -->
  <circle cx="200" cy="200" r="160" fill="url(#flame)" opacity="0.5"/>

  <!-- Flame -->
  <path d="M200,90 Q180,140 188,170 Q175,165 178,185 Q170,200 195,225 Q185,210 200,210 Q215,210 205,225 Q230,200 222,185 Q225,165 212,170 Q220,140 200,90 Z" fill="url(#flame)"/>
  <path d="M200,140 Q192,160 196,180 Q190,185 200,200 Q210,185 204,180 Q208,160 200,140 Z" fill="#FFF4D6" opacity="0.9"/>

  <!-- Wick -->
  <rect x="198" y="225" width="4" height="15" fill="#5C3A1E"/>

  <!-- Lamp base (cow dung shape) -->
  <ellipse cx="200" cy="310" rx="90" ry="20" fill="#5C3A1E"/>
  <path d="M110,290 Q90,270 105,250 Q120,230 150,225 Q180,220 200,222 Q220,220 250,225 Q280,230 295,250 Q310,270 290,290 Q260,300 200,300 Q140,300 110,290 Z" fill="url(#base)"/>

  <!-- Diya highlight -->
  <ellipse cx="200" cy="240" rx="60" ry="12" fill="#3A2410" opacity="0.6"/>
  <ellipse cx="200" cy="240" rx="55" ry="10" fill="#D2691E" opacity="0.4"/>

  <!-- Texture on lamp -->
  <g opacity="0.5" stroke="#3A2410" fill="none" stroke-width="0.8">
    <path d="M130,260 Q150,255 170,260"/>
    <path d="M230,260 Q250,255 270,260"/>
    <circle cx="140" cy="275" r="2" fill="#3A2410"/>
    <circle cx="260" cy="275" r="2" fill="#3A2410"/>
    <circle cx="200" cy="280" r="2.5" fill="#3A2410"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFD580">
    <circle cx="120" cy="150" r="1.5" opacity="0.7"/>
    <circle cx="280" cy="130" r="1.2" opacity="0.6"/>
    <circle cx="80" cy="220" r="1.0" opacity="0.7"/>
    <circle cx="320" cy="200" r="1.4" opacity="0.5"/>
  </g>
</svg>
