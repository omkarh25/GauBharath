<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3A2410"/>
      <stop offset="60%" stop-color="#1E1408"/>
      <stop offset="100%" stop-color="#0E0904"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#FFD580" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#EAA65C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8E4214" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A4F2A"/>
      <stop offset="100%" stop-color="#3A2410"/>
    </linearGradient>
    <linearGradient id="pack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D2691E"/>
      <stop offset="100%" stop-color="#8E4214"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- decorative frame -->
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#8E4214" stroke-width="1" opacity="0.4"/>
  <rect x="30" y="30" width="340" height="340" fill="none" stroke="#D2691E" stroke-width="0.5" opacity="0.3"/>

  <!-- Pack -->
  <g transform="translate(80,80)">
    <rect x="0" y="0" width="240" height="280" rx="12" fill="url(#pack)" stroke="#5C3A1E" stroke-width="2"/>
    <rect x="10" y="10" width="220" height="260" rx="8" fill="none" stroke="#FAF6F0" stroke-width="0.8" opacity="0.6"/>

    <!-- decorative emblem -->
    <circle cx="120" cy="80" r="32" fill="#FAF6F0" opacity="0.9"/>
    <circle cx="120" cy="80" r="28" fill="none" stroke="#8E4214" stroke-width="1.2"/>
    <path d="M120,55 L130,75 L120,95 L110,75 Z" fill="#8E4214"/>
    <circle cx="120" cy="75" r="3" fill="#5C3A1E"/>

    <text x="120" y="155" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#FAF6F0" text-anchor="middle" letter-spacing="2">AGNI HOTRA</text>
    <text x="120" y="178" font-family="Georgia, serif" font-size="14" fill="#FAF6F0" text-anchor="middle" letter-spacing="3" opacity="0.85">DHOOP STICKS</text>
    <line x1="40" y1="200" x2="200" y2="200" stroke="#FAF6F0" stroke-width="0.5" opacity="0.4"/>
    <text x="120" y="225" font-family="Georgia, serif" font-size="10" fill="#FAF6F0" text-anchor="middle" letter-spacing="2" opacity="0.75">SACRED FRAGRANCE</text>
    <text x="120" y="250" font-family="Georgia, serif" font-size="9" fill="#FAF6F0" text-anchor="middle" letter-spacing="1" opacity="0.6">— gau bharath —</text>
  </g>

  <!-- Dhoop stick peeking out -->
  <g transform="translate(150,70)">
    <rect x="0" y="0" width="6" height="20" fill="url(#stick)"/>
    <rect x="-2" y="-6" width="10" height="8" rx="2" fill="url(#stick)"/>
    <rect x="-3" y="-12" width="12" height="6" rx="2" fill="#FAE6CF"/>
  </g>

  <!-- Glow halo -->
  <ellipse cx="200" cy="220" rx="160" ry="100" fill="url(#glow)" opacity="0.6"/>

  <!-- Sparkle particles -->
  <g fill="#FFD580">
    <circle cx="80" cy="120" r="1.5" opacity="0.8"/>
    <circle cx="320" cy="140" r="1.2" opacity="0.6"/>
    <circle cx="100" cy="280" r="1.8" opacity="0.7"/>
    <circle cx="300" cy="260" r="1.4" opacity="0.5"/>
    <circle cx="60" cy="200" r="1.0" opacity="0.7"/>
    <circle cx="340" cy="220" r="1.3" opacity="0.6"/>
  </g>
</svg>
