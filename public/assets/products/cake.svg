<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3A2410"/>
      <stop offset="100%" stop-color="#0E0904"/>
    </radialGradient>
    <linearGradient id="cake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A4F2A"/>
      <stop offset="100%" stop-color="#3A2410"/>
    </linearGradient>
    <pattern id="straw" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0,3 L3,0 L6,3 L3,6 Z" fill="#5C3A1E" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#8E4214" stroke-width="1" opacity="0.4"/>

  <!-- Stack of dung cakes -->
  <g transform="translate(60,160)">
    <ellipse cx="120" cy="40" rx="120" ry="35" fill="url(#cake)" stroke="#281808" stroke-width="1.5"/>
    <ellipse cx="120" cy="40" rx="115" ry="30" fill="url(#straw)"/>
    <ellipse cx="120" cy="50" rx="115" ry="28" fill="#3A2410" opacity="0.5"/>

    <ellipse cx="140" cy="100" rx="115" ry="32" fill="url(#cake)" stroke="#281808" stroke-width="1.5"/>
    <ellipse cx="140" cy="100" rx="110" ry="28" fill="url(#straw)"/>

    <ellipse cx="120" cy="155" rx="110" ry="30" fill="url(#cake)" stroke="#281808" stroke-width="1.5"/>
    <ellipse cx="120" cy="155" rx="105" ry="26" fill="url(#straw)"/>

    <ellipse cx="130" cy="205" rx="100" ry="28" fill="url(#cake)" stroke="#281808" stroke-width="1.5"/>
    <ellipse cx="130" cy="205" rx="95" ry="24" fill="url(#straw)"/>
  </g>

  <!-- Highlight rim -->
  <g opacity="0.3">
    <path d="M70,180 Q200,160 330,180" stroke="#D2691E" stroke-width="0.8" fill="none"/>
    <path d="M70,125 Q200,105 330,125" stroke="#D2691E" stroke-width="0.8" fill="none"/>
    <path d="M70,70 Q200,50 330,70" stroke="#D2691E" stroke-width="0.8" fill="none"/>
  </g>

  <!-- Title -->
  <text x="200" y="60" font-family="Georgia, serif" font-size="20" fill="#FAE6CF" text-anchor="middle" letter-spacing="3" opacity="0.7">GOMAYA</text>
</svg>
