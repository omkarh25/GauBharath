<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="hbg" cx="40%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#5C3A1E"/>
      <stop offset="40%" stop-color="#3A1A0A"/>
      <stop offset="100%" stop-color="#0A0500"/>
    </radialGradient>
    <radialGradient id="glow-warm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D2691E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#D2691E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#D2691E" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#hbg)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <!-- Soft glow blob -->
  <circle cx="700" cy="540" r="500" fill="url(#glow-warm)"/>
  <circle cx="1400" cy="640" r="400" fill="url(#glow-warm)" opacity="0.6"/>

  <!-- Decorative mandala circles -->
  <g transform="translate(1500,200)" opacity="0.12" stroke="#D2691E" fill="none">
    <circle r="200" stroke-width="0.5"/>
    <circle r="160" stroke-width="0.5"/>
    <circle r="120" stroke-width="0.5"/>
    <circle r="80" stroke-width="0.5"/>
    <circle r="40" stroke-width="0.5"/>
  </g>
  <g transform="translate(300,900)" opacity="0.1" stroke="#FAE6CF" fill="none">
    <circle r="160" stroke-width="0.5"/>
    <circle r="120" stroke-width="0.5"/>
    <circle r="80" stroke-width="0.5"/>
    <circle r="40" stroke-width="0.5"/>
  </g>

  <!-- Subtle particle field -->
  <g fill="#FAE6CF">
    <circle cx="200" cy="180" r="2" opacity="0.4"/>
    <circle cx="450" cy="280" r="1.5" opacity="0.3"/>
    <circle cx="700" cy="150" r="2" opacity="0.5"/>
    <circle cx="950" cy="350" r="1.8" opacity="0.4"/>
    <circle cx="1200" cy="200" r="2" opacity="0.3"/>
    <circle cx="1500" cy="450" r="1.5" opacity="0.4"/>
    <circle cx="1700" cy="250" r="2" opacity="0.5"/>
    <circle cx="100" cy="700" r="1.5" opacity="0.3"/>
    <circle cx="1800" cy="850" r="2" opacity="0.4"/>
    <circle cx="350" cy="900" r="1.8" opacity="0.3"/>
  </g>

  <!-- Vignette -->
  <defs>
    <radialGradient id="vignette-h" cx="50%" cy="50%" r="75%">
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#vignette-h)"/>
</svg>
