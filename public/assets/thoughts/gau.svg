<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0500"/>
      <stop offset="40%" stop-color="#1A0A05"/>
      <stop offset="100%" stop-color="#3A1A0A"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF4D6"/>
      <stop offset="80%" stop-color="#FFD580" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D2691E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky2)"/>

  <!-- Moon glow -->
  <circle cx="1500" cy="280" r="350" fill="url(#moon)" opacity="0.4"/>
  <circle cx="1500" cy="280" r="120" fill="#FFF4D6" opacity="0.95"/>
  <circle cx="1530" cy="270" r="105" fill="#1A0A05" opacity="0.7"/>

  <!-- Stars -->
  <g fill="#FFF4D6">
    <circle cx="200" cy="150" r="2"/>
    <circle cx="450" cy="80" r="1.5"/>
    <circle cx="700" cy="200" r="2.5"/>
    <circle cx="900" cy="120" r="1.8"/>
    <circle cx="1100" cy="300" r="2"/>
    <circle cx="350" cy="320" r="1.5"/>
    <circle cx="600" cy="380" r="1.8"/>
    <circle cx="1750" cy="500" r="2"/>
    <circle cx="1800" cy="650" r="1.8"/>
    <circle cx="100" cy="450" r="1.5"/>
  </g>

  <!-- Distant trees -->
  <g opacity="0.7">
    <ellipse cx="200" cy="780" rx="120" ry="60" fill="#0A0500"/>
    <ellipse cx="350" cy="800" rx="100" ry="50" fill="#0A0500"/>
    <ellipse cx="1650" cy="780" rx="140" ry="65" fill="#0A0500"/>
    <ellipse cx="1800" cy="800" rx="100" ry="50" fill="#0A0500"/>
  </g>

  <!-- Cow silhouette (large, central) -->
  <g transform="translate(700,500)" fill="#0A0500">
    <!-- body -->
    <ellipse cx="260" cy="280" rx="280" ry="120"/>
    <!-- head -->
    <ellipse cx="-50" cy="220" rx="100" ry="80"/>
    <!-- horns -->
    <path d="M-90,180 Q-130,140 -140,100 Q-110,110 -85,140 Z"/>
    <path d="M-10,180 Q-30,130 -10,90 Q10,100 5,140 Z" fill="#0A0500"/>
    <!-- ears -->
    <ellipse cx="-30" cy="180" rx="30" ry="20" transform="rotate(-30 -30 180)"/>
    <!-- legs -->
    <rect x="60" y="350" width="30" height="120" rx="8"/>
    <rect x="120" y="350" width="30" height="125" rx="8"/>
    <rect x="380" y="350" width="30" height="120" rx="8"/>
    <rect x="440" y="350" width="30" height="125" rx="8"/>
    <!-- tail -->
    <path d="M520,260 Q580,250 600,200 Q605,180 590,170 Q580,200 555,220 Z"/>
  </g>

  <!-- Ground -->
  <rect y="850" width="1920" height="230" fill="#0A0500"/>
  <rect y="850" width="1920" height="2" fill="#3A1A0A" opacity="0.5"/>

  <!-- Vignette -->
  <defs>
    <radialGradient id="vignette2" cx="50%" cy="50%" r="75%">
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#vignette2)"/>
</svg>
