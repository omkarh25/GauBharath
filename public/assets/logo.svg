<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAA65C"/>
      <stop offset="100%" stop-color="#8E4214"/>
    </linearGradient>
    <linearGradient id="logo-saffron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD580"/>
      <stop offset="100%" stop-color="#D2691E"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="60" cy="60" r="58" fill="#1A0A05" stroke="url(#logo-grad)" stroke-width="2"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#logo-grad)" stroke-width="0.5" opacity="0.6"/>

  <!-- Cow silhouette in center -->
  <g transform="translate(60,70)" fill="url(#logo-saffron)">
    <!-- body -->
    <ellipse cx="0" cy="0" rx="28" ry="14"/>
    <!-- head -->
    <ellipse cx="-22" cy="-6" rx="11" ry="9"/>
    <!-- horn -->
    <path d="M-30,-12 Q-34,-22 -28,-26 Q-26,-22 -24,-16 Z"/>
    <!-- legs -->
    <rect x="-18" y="10" width="4" height="14" rx="1"/>
    <rect x="-8" y="10" width="4" height="14" rx="1"/>
    <rect x="14" y="10" width="4" height="14" rx="1"/>
    <rect x="22" y="10" width="4" height="14" rx="1"/>
    <!-- tail -->
    <path d="M27,-2 Q33,-4 33,-12 Q30,-10 28,-6 Z"/>
  </g>

  <!-- Sun rays above -->
  <g stroke="url(#logo-saffron)" stroke-width="1" opacity="0.7">
    <line x1="60" y1="10" x2="60" y2="20"/>
    <line x1="45" y1="14" x2="48" y2="22"/>
    <line x1="75" y1="14" x2="72" y2="22"/>
    <line x1="30" y1="22" x2="36" y2="28"/>
    <line x1="90" y1="22" x2="84" y2="28"/>
  </g>

  <!-- Small om above -->
  <text x="60" y="35" font-family="Georgia, serif" font-size="14" fill="url(#logo-saffron)" text-anchor="middle" font-weight="bold">ॐ</text>

  <!-- Bottom text -->
  <text x="60" y="108" font-family="Georgia, serif" font-size="6" fill="#EAA65C" text-anchor="middle" letter-spacing="1.5">GAU BHARATH</text>
</svg>
